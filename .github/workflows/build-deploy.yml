name: build-deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check -- --strict
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}

      # `secrets` is not allowed directly in `if:`, so pass it through env and
      # expose only a boolean. The token is scoped to this step and the deploy.
      - name: Detect Cloudflare token
        id: cf
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: ${{ steps.cf.outputs.deploy == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
